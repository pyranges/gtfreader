[build-system]
requires = [
    "setuptools>=69",
    "wheel",
    "Cython>=3.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "gtfreader"
version = "0.3.0"
description = "Fast Cython-backed parsing for GTF attribute columns."
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Endre Bakken Stovner" },
]
dependencies = [
    "pandas>=2.0",
    "numpy",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
# pyarrow parses the nine fixed GTF columns on every core instead of one. It is
# optional: without it the reader falls back to pandas and returns the same
# frame, just more slowly.
fast-io = ["pyarrow"]

[tool.setuptools]
ext-modules = [
    {name = "gtfreader._parser", sources = ["gtfreader/_parser.pyx"]},
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gtfreader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp312-* cp313-*"
skip = "pp* *-musllinux_* *-manylinux_i686"
test-command = "pytest -q {project}/tests"
test-requires = ["pytest", "pyarrow"]

[tool.cibuildwheel.linux]
archs = ["x86_64"]
# manylinux2014 is glibc 2.17, and neither of this package's dependencies ships
# a wheel that old any more: pandas is manylinux_2_24+, numpy manylinux_2_27+
# and pyarrow manylinux_2_28 only. pip therefore fell back to their sdists
# inside the container and tried to compile numpy, which wants GCC >= 10.3 --
# newer than manylinux2014 carries. The build itself was fine; it was the test
# install that could not be satisfied.
#
# 2_28 is the oldest image where all three resolve to wheels. It raises the
# glibc floor for the wheels published here, which costs nothing real: a user
# too old for this tag could not install pandas either, and pandas is a hard
# dependency.
manylinux-x86_64-image = "manylinux_2_28"
